name: Fetch Minecraft assets

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'full (descargar todo)'
        required: true
        default: 'full'
      index_name:
        description: 'ID del asset index (26 para 1.21.8)'
        required: true
        default: '26'
      index_sha1:
        description: 'SHA1 del asset index'
        required: true
        default: 'b95def05dcfc4c523b59d607540c8c95df4da762'

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download asset index
        run: |
          curl -fsSL -o index.json \
            "https://piston-meta.mojang.com/v1/packages/${{ inputs.index_sha1 }}/${{ inputs.index_name }}.json"
          python3 -c "import json; d=json.load(open('index.json')); print(len(d['objects']), 'objects')"

      - name: Download all asset objects
        run: python3 scripts/fetch-assets.py

      - name: Upload core assets
        uses: actions/upload-artifact@v4
        with:
          name: assets-core
          path: out/core/
          if-no-files-found: error
          compression-level: 0

      - name: Upload sounds
        uses: actions/upload-artifact@v4
        with:
          name: assets-sounds
          path: out/sounds/
          if-no-files-found: error
          compression-level: 0
